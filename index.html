<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Registro de Documentación con OCR</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.css">
<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>

<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1e40af;
    --success: #16a34a;
    --danger: #dc2626;
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    padding: 16px; padding-bottom: calc(80px + var(--safe-bottom));
    max-width: 640px; margin-inline: auto;
    overflow-x: hidden;
  }
  h1 { font-size: 1.35rem; margin: 0 0 16px; text-align: center; }
  .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  label { display: block; font-size: .85rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  input, select, textarea {
    width: 100%; padding: 12px; font-size: 1rem; border: 1px solid var(--border);
    border-radius: 8px; background: #f8fafc; color: var(--text); outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); background: #fff; }
  .field { margin-bottom: 14px; }
  .row { display: flex; gap: 12px; }
  .row > .field { flex: 1; }
  button { font-family: inherit; font-size: 1rem; font-weight: 600; cursor: pointer; border: none; border-radius: 10px; padding: 14px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .1s, background .15s; }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-outline { background: #fff; color: var(--primary); border: 2px solid var(--primary); }
  .btn-group { display: flex; gap: 10px; }
  .btn-group button { flex: 1; }

  /* ====== Cámara tipo Google Lens ====== */
  #cameraWrap {
    display: none; position: fixed; inset: 0; background: #000; z-index: 1000;
  }
  #cameraWrap.active { display: block; }

  #video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;   /* llena la pantalla sin deformar */
    background: #000;
  }

  /* Guía visual tipo Lens (marco de encuadre del documento) */
  #frameGuide {
    position: absolute; inset: 8% 6%;
    border: 2px dashed rgba(255,255,255,.75);
    border-radius: 12px;
    pointer-events: none;
    box-shadow: 0 0 0 9999px rgba(0,0,0,.25);
    display: none;
  }
  #cameraWrap.guide #frameGuide { display: block; }

  /* Barra superior con botón cerrar */
  .cam-top {
    position: absolute; top: 0; left: 0; right: 0;
    padding: calc(var(--safe-top) + 12px) 16px 12px;
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(to bottom, rgba(0,0,0,.6), transparent);
    z-index: 2;
  }
  .cam-top .cam-title { color: #fff; font-size: .9rem; font-weight: 600; opacity: .9; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(0,0,0,.45); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; padding: 0;
  }

  /* Controles inferiores — flotantes y siempre visibles */
  .cam-bottom {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 20px 24px calc(var(--safe-bottom) + 20px);
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(to top, rgba(0,0,0,.75), transparent);
    z-index: 2;
    gap: 20px;
  }
  .shutter {
    flex: 0 0 auto;
    width: 74px; height: 74px;
    border-radius: 50%;
    background: #fff;
    border: 5px solid rgba(255,255,255,.5);
    padding: 0;
    box-shadow: 0 0 0 3px #000 inset;
  }
  .shutter:active { background: #e2e8f0; }

  /* ====== Cropper ====== */
  #cropperWrap { display: none; position: fixed; inset: 0; background: #000; z-index: 1001; flex-direction: column; }
  #cropperWrap.active { display: flex; }
  #cropperWrap .cropper-container-wrap { flex: 1; min-height: 0; overflow: hidden; position: relative; }
  #cropperImage { max-width: 100%; max-height: 100%; display: block; }
  .crop-bar {
    padding: 14px 14px calc(var(--safe-bottom) + 14px);
    background: #111; display: flex; gap: 10px;
  }
  .crop-bar button { flex: 1; }

  /* ====== Preview y estados ====== */
  #preview { max-width: 100%; border-radius: 8px; display: none; margin-top: 10px; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid #fff3; border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { font-size: .85rem; color: var(--muted); margin-top: 8px; text-align: center; min-height: 18px; }
  .toast {
    position: fixed; bottom: calc(20px + var(--safe-bottom)); left: 50%;
    transform: translateX(-50%) translateY(120%);
    background: var(--text); color: #fff; padding: 12px 22px; border-radius: 10px;
    font-size: .9rem; transition: transform .3s; z-index: 2000; max-width: 90%;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .hint { font-size: .78rem; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>

<h1>📋 Registro de Documentación</h1>

<div class="card">
  <div class="row">
    <div class="field">
      <label for="cite">Nro. CITE *</label>
      <input id="cite" type="text" placeholder="Ej: CITE-2024-001" autocomplete="off">
    </div>
    <div class="field">
      <label for="correlativo">Nro. Correlativo *</label>
      <input id="correlativo" type="text" placeholder="Ej: 0001" autocomplete="off">
    </div>
  </div>

  <div class="field">
    <label for="tipo">Tipo de Documento *</label>
    <select id="tipo">
      <option value="">— Seleccionar —</option>
      <option>Oficio</option><option>Memorándum</option><option>Carta</option>
      <option>Informe</option><option>Solicitud</option><option>Resolución</option>
      <option>Circular</option><option>Nota</option><option>Otro</option>
    </select>
  </div>

  <div class="field">
    <label>Texto extraído del documento</label>
    <button id="btnScan" class="btn-primary">📷 Escanear documento</button>
    <button id="btnGallery" class="btn-outline" style="margin-top:8px">🖼️ Subir imagen de galería</button>
    <input id="fileInput" type="file" accept="image/*" style="display:none">
    <p class="hint">Motor OCR precargado · elige solo la región del texto para mayor velocidad y precisión.</p>
    <img id="preview" alt="Región seleccionada">
    <div id="status" class="status"></div>
  </div>

  <div class="field">
    <label for="textoOCR">Contenido (editable)</label>
    <textarea id="textoOCR" rows="6" placeholder="El texto reconocido aparecerá aquí..."></textarea>
  </div>

  <button id="btnGuardar" class="btn-success">💾 Guardar Registro</button>
</div>

<!-- Cámara -->
<div id="cameraWrap">
  <video id="video" autoplay playsinline muted></video>
  <div id="frameGuide"></div>
  <div class="cam-top">
    <button class="icon-btn" id="btnCancelCam" aria-label="Cerrar">✕</button>
    <span class="cam-title">Encuadra el documento</span>
    <button class="icon-btn" id="btnSwitchCam" aria-label="Cambiar cámara">🔄</button>
  </div>
  <div class="cam-bottom">
    <div style="width:44px"></div>
    <button class="shutter" id="btnShutter" aria-label="Capturar"></button>
    <div style="width:44px"></div>
  </div>
</div>

<!-- Cropper -->
<div id="cropperWrap">
  <div class="cropper-container-wrap">
    <img id="cropperImage" alt="Recorte">
  </div>
  <div class="crop-bar">
    <button class="btn-danger" id="btnCancelCrop">Cancelar</button>
    <button class="btn-primary" id="btnApplyCrop">✂️ Extraer texto</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* ============================================================
   Estado
   ============================================================ */
const state = {
  stream: null,
  cropper: null,
  facingMode: 'environment',
  ocrWorker: null,      // worker Tesseract precargado
  ocrReady: false,
  ocrLoading: false,
  registros: JSON.parse(localStorage.getItem('registros_docs') || '[]')
};
const $ = (id) => document.getElementById(id);

/* ============================================================
   Utilidades UI
   ============================================================ */
function toast(msg, ms = 2800) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), ms);
}
function setStatus(msg, loading = false) {
  $('status').innerHTML = loading ? `<span class="spinner"></span> ${msg}` : msg;
}

/* ============================================================
   PRECARGA DEL MOTOR OCR (arranca al abrir la página)
   Esto es lo que hace que se sienta "rápido" como Lens.
   ============================================================ */
async function preloadOCR() {
  if (state.ocrReady || state.ocrLoading) return;
  state.ocrLoading = true;
  try {
    state.ocrWorker = await Tesseract.createWorker('spa', 1, {
      logger: () => {} // silencioso durante precarga
    });
    // Ajustes que aceleran y mejoran OCR en documentos
    await state.ocrWorker.setParameters({
      tessedit_pageseg_mode: '6',          // asume bloque uniforme de texto
      preserve_interword_spaces: '1'
    });
    state.ocrReady = true;
    console.log('[OCR] Motor listo');
  } catch (e) {
    console.warn('[OCR] No se pudo precargar', e);
  } finally {
    state.ocrLoading = false;
  }
}

/* ============================================================
   CÁMARA (resolución moderada = menos lag)
   ============================================================ */
async function openCamera() {
  const video = $('video');
  try {
    // Resolución ideal 1280x720 → suficiente para OCR y fluido en gama media
    state.stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: state.facingMode },
        width:  { ideal: 1280 },
        height: { ideal: 720 },
        frameRate: { ideal: 30, max: 30 }
      },
      audio: false
    });
    video.srcObject = state.stream;
    await video.play();
    $('cameraWrap').classList.add('active', 'guide');
    // Precarga el OCR en paralelo si aún no está listo
    preloadOCR();
  } catch (err) {
    console.error(err);
    toast('No se pudo abrir la cámara: ' + err.name, 4000);
  }
}

function closeCamera() {
  if (state.stream) {
    state.stream.getTracks().forEach(t => t.stop());
    state.stream = null;
  }
  $('video').srcObject = null;
  $('cameraWrap').classList.remove('active');
}

async function switchCamera() {
  state.facingMode = state.facingMode === 'environment' ? 'user' : 'environment';
  closeCamera();
  await openCamera();
}

function capturePhoto() {
  const video = $('video');
  if (!video.videoWidth) { toast('La cámara aún no está lista'); return; }
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
  closeCamera();
  openCropper(dataUrl);
}

/* ============================================================
   CROPPER
   ============================================================ */
function openCropper(dataUrl) {
  const img = $('cropperImage');
  img.src = dataUrl;
  $('cropperWrap').classList.add('active');

  img.onload = () => {
    if (state.cropper) state.cropper.destroy();
    state.cropper = new Cropper(img, {
      viewMode: 1,
      autoCropArea: 0.7,
      movable: true,
      zoomable: true,
      scalable: false,
      responsive: true,
      background: false,
      guides: true,
      cropBoxMovable: true,
      cropBoxResizable: true
    });
  };
}

function closeCropper() {
  $('cropperWrap').classList.remove('active');
  if (state.cropper) { state.cropper.destroy(); state.cropper = null; }
}

async function applyCropAndOCR() {
  if (!state.cropper) return;
  const canvas = state.cropper.getCroppedCanvas({
    maxWidth: 1400, maxHeight: 1400, fillColor: '#fff'
  });

  // Preprocesado: escala de grises + contraste para acelerar el OCR
  const processed = preprocessForOCR(canvas);
  const croppedDataUrl = processed.toDataURL('image/jpeg', 0.92);

  $('preview').src = croppedDataUrl;
  $('preview').style.display = 'block';

  closeCropper();
  await runOCR(croppedDataUrl);
}

/* Escala de grises + ajuste de contraste simple (rápido en canvas) */
function preprocessForOCR(sourceCanvas) {
  const c = document.createElement('canvas');
  c.width = sourceCanvas.width;
  c.height = sourceCanvas.height;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(sourceCanvas, 0, 0);
  const img = ctx.getImageData(0, 0, c.width, c.height);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const g = (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114);
    const v = g < 110 ? 0 : g > 160 ? 255 : g; // ligero umbral suave
    d[i] = d[i+1] = d[i+2] = v;
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

/* ============================================================
   OCR (usa el worker precargado)
   ============================================================ */
async function runOCR(imageDataUrl) {
  if (!state.ocrReady) {
    setStatus('Cargando motor OCR (primera vez)...', true);
    await preloadOCR();
    if (!state.ocrReady) { setStatus('❌ No se pudo cargar OCR', false); return; }
  }
  setStatus('Reconociendo texto...', true);
  try {
    const { data: { text } } = await state.ocrWorker.recognize(imageDataUrl);
    const limpio = text.trim().replace(/\n{3,}/g, '\n\n');
    const ta = $('textoOCR');
    ta.value = ta.value ? ta.value + '\n' + limpio : limpio;
    setStatus(`✅ Texto extraído (${limpio.length} caracteres)`);
    toast('Texto reconocido');
  } catch (err) {
    console.error(err);
    setStatus('❌ Error al reconocer texto');
    toast('Error OCR: ' + err.message, 4000);
  }
}

/* ============================================================
   Galería (respaldo si la cámara no está disponible)
   ============================================================ */
$('btnGallery').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', (e) => {
  const f = e.target.files?.[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = (ev) => openCropper(ev.target.result);
  reader.readAsDataURL(f);
  e.target.value = '';
});

/* ============================================================
   Guardar
   ============================================================ */
function guardar() {
  const cite = $('cite').value.trim();
  const correlativo = $('correlativo').value.trim();
  const tipo = $('tipo').value;
  const texto = $('textoOCR').value.trim();
  if (!cite || !correlativo || !tipo) { toast('Complete CITE, Correlativo y Tipo'); return; }

  state.registros.push({ id: Date.now(), cite, correlativo, tipo, texto, fecha: new Date().toISOString() });
  localStorage.setItem('registros_docs', JSON.stringify(state.registros));
  toast('✅ Registro guardado');

  $('cite').value = ''; $('correlativo').value = ''; $('tipo').value = '';
  $('textoOCR').value = ''; $('preview').style.display = 'none'; setStatus('');
}

/* ============================================================
   Eventos
   ============================================================ */
$('btnScan').addEventListener('click', openCamera);
$('btnCancelCam').addEventListener('click', closeCamera);
$('btnShutter').addEventListener('click', capturePhoto);
$('btnSwitchCam').addEventListener('click', switchCamera);
$('btnCancelCrop').addEventListener('click', closeCropper);
$('btnApplyCrop').addEventListener('click', applyCropAndOCR);
$('btnGuardar').addEventListener('click', guardar);

$('cite').addEventListener('blur', () => {
  const corr = $('correlativo');
  if (corr.value) return;
  const m = $('cite').value.match(/(\d+)\s*$/);
  if (m) corr.value = m[1].padStart(4, '0');
});

window.addEventListener('beforeunload', () => {
  if (state.stream) state.stream.getTracks().forEach(t => t.stop());
});

// Precarga el OCR en cuanto el navegador esté libre
if ('requestIdleCallback' in window) requestIdleCallback(preloadOCR, { timeout: 3000 });
else setTimeout(preloadOCR, 1500);
</script>
</body>
</html>
