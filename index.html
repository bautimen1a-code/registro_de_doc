<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Registro de Documentación</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.css">
<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
  :root{
    --primary:#2563eb; --primary-dark:#1e40af; --success:#16a34a; --danger:#dc2626;
    --warn:#f59e0b; --bg:#f1f5f9; --card:#fff; --text:#1e293b; --muted:#64748b;
    --border:#e2e8f0;
    --safe-top: env(safe-area-inset-top,0px);
    --safe-bottom: env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);
    padding:16px;padding-bottom:calc(80px + var(--safe-bottom));
    max-width:640px;margin-inline:auto;overflow-x:hidden;
  }
  h1{font-size:1.3rem;margin:0 0 14px;text-align:center;}
  .card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  label{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.02em;}
  input,select,textarea{
    width:100%;padding:12px;font-size:1rem;border:1px solid var(--border);
    border-radius:8px;background:#f8fafc;color:var(--text);outline:none;
    font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--primary);background:#fff;}
  .field{margin-bottom:14px;}
  .row{display:flex;gap:12px;}
  .row>.field{flex:1;min-width:0;}
  button{
    font-family:inherit;font-size:1rem;font-weight:600;cursor:pointer;
    border:none;border-radius:10px;padding:14px;width:100%;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .1s,background .15s;
  }
  button:active{transform:scale(.98);}
  button:disabled{opacity:.55;cursor:not-allowed;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-success{background:var(--success);color:#fff;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-warn{background:var(--warn);color:#fff;}
  .btn-outline{background:#fff;color:var(--primary);border:2px solid var(--primary);}
  .btn-ghost{background:#f1f5f9;color:var(--text);}
  .btn-sm{padding:9px 12px;font-size:.85rem;width:auto;}
  .btn-group{display:flex;gap:10px;}
  .btn-group button{flex:1;}

  .ocr-row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .ocr-row .tag{
    font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;
    background:#e0e7ff;color:#3730a3;
  }
  .ocr-row .tag.ok{background:#dcfce7;color:#166534;}
  .ocr-row .tag.empty{background:#f1f5f9;color:#64748b;}

  /* ========= PICKER DE FECHA Y HORA (ruleta deslizable) ========= */
  .picker{
    display:flex;gap:0;background:#f8fafc;border:1px solid var(--border);
    border-radius:10px;overflow:hidden;height:150px;position:relative;
  }
  .picker::before, .picker::after{
    content:"";position:absolute;left:0;right:0;height:50px;pointer-events:none;z-index:2;
  }
  .picker::before{top:0;background:linear-gradient(to bottom,#f8fafc, rgba(248,250,252,0));}
  .picker::after{bottom:0;background:linear-gradient(to top,#f8fafc, rgba(248,250,252,0));}
  .picker-highlight{
    position:absolute;left:8px;right:8px;top:50px;height:50px;
    background:rgba(37,99,235,.08);border-top:1px solid rgba(37,99,235,.35);
    border-bottom:1px solid rgba(37,99,235,.35);pointer-events:none;z-index:1;
  }
  .picker-col{
    flex:1;height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative;z-index:3;
  }
  .picker-col::-webkit-scrollbar{display:none;}
  .picker-col .item{
    height:50px;line-height:50px;text-align:center;font-size:1.05rem;
    scroll-snap-align:center;color:var(--text);font-variant-numeric:tabular-nums;
    transition:opacity .12s, transform .12s;
  }
  .picker-col .item.dim{color:#94a3b8;}
  .picker-col .item.sel{font-weight:700;color:var(--primary);}

  /* Cámara */
  #cameraWrap{display:none;position:fixed;inset:0;background:#000;z-index:1000;}
  #cameraWrap.active{display:block;}
  #video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;}
  #frameGuide{
    position:absolute;inset:8% 6%;border:2px dashed rgba(255,255,255,.75);
    border-radius:12px;pointer-events:none;
    box-shadow:0 0 0 9999px rgba(0,0,0,.25);display:none;
  }
  #cameraWrap.guide #frameGuide{display:block;}
  .cam-top{
    position:absolute;top:0;left:0;right:0;
    padding:calc(var(--safe-top) + 12px) 16px 12px;
    display:flex;justify-content:space-between;align-items:center;
    background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent);z-index:2;
  }
  .cam-top .cam-title{color:#fff;font-size:.9rem;font-weight:600;opacity:.9;}
  .icon-btn{
    width:44px;height:44px;border-radius:50%;
    background:rgba(0,0,0,.45);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:1.2rem;padding:0;
  }
  .cam-bottom{
    position:absolute;bottom:0;left:0;right:0;
    padding:20px 24px calc(var(--safe-bottom) + 20px);
    display:flex;justify-content:space-between;align-items:center;
    background:linear-gradient(to top,rgba(0,0,0,.75),transparent);z-index:2;gap:20px;
  }
  .shutter{
    flex:0 0 auto;width:74px;height:74px;border-radius:50%;background:#fff;
    border:5px solid rgba(255,255,255,.5);padding:0;
    box-shadow:0 0 0 3px #000 inset;
  }

  .dest-picker{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .dest-picker button{flex-direction:column;padding:16px;line-height:1.2;font-size:.95rem;}
  .dest-picker button small{font-weight:400;font-size:.72rem;opacity:.85;margin-top:4px;}

  /* Cropper */
  #cropperWrap{display:none;position:fixed;inset:0;background:#000;z-index:1001;flex-direction:column;}
  #cropperWrap.active{display:flex;}
  #cropperWrap .cropper-container-wrap{flex:1;min-height:0;overflow:hidden;position:relative;}
  #cropperImage{max-width:100%;max-height:100%;display:block;}
  .crop-bar{padding:14px 14px calc(var(--safe-bottom) + 14px);background:#111;display:flex;gap:10px;flex-direction:column;}
  .crop-bar .target-label{
    color:#fbbf24;font-size:.8rem;font-weight:700;text-align:center;
    padding-bottom:6px;text-transform:uppercase;letter-spacing:.05em;
  }
  .crop-bar .actions{display:flex;gap:10px;}
  .crop-bar .actions button{flex:1;}

  #preview{max-width:100%;border-radius:8px;display:none;margin-top:6px;}

  .spinner{
    display:inline-block;width:18px;height:18px;border:3px solid #fff3;
    border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .toast{
    position:fixed;bottom:calc(20px + var(--safe-bottom));left:50%;
    transform:translateX(-50%) translateY(120%);
    background:var(--text);color:#fff;padding:12px 22px;border-radius:10px;
    font-size:.9rem;transition:transform .3s;z-index:2000;max-width:90%;
    text-align:center;
  }
  .toast.show{transform:translateX(-50%) translateY(0);}

  /* ========= MODAL REGISTROS TIPO EXCEL ========= */
  #listModal{
    display:none;position:fixed;inset:0;background:var(--bg);z-index:1500;
    flex-direction:column;
  }
  #listModal.active{display:flex;}
  .list-header{
    padding:calc(var(--safe-top) + 12px) 14px 12px;
    background:#fff;border-bottom:1px solid var(--border);
    display:flex;flex-direction:column;gap:10px;
  }
  .list-header .title-row{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .list-header h2{font-size:1.1rem;margin:0;}
  .list-header .search-row{display:flex;gap:8px;align-items:center;}
  .list-header .search-row input{
    flex:1;padding:10px 12px;font-size:.92rem;
    border-radius:8px;border:1px solid var(--border);background:#f8fafc;
  }
  .list-header .count{
    font-size:.78rem;color:var(--muted);text-align:right;
    padding:0 2px;
  }

  /* Tabla estilo Excel */
  .xls-wrap{
    flex:1;overflow:auto;-webkit-overflow-scrolling:touch;
    background:#fff;
  }
  table.xls{
    border-collapse:collapse;width:max-content;min-width:100%;
    font-size:.78rem;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  table.xls th, table.xls td{
    border:1px solid #cbd5e1;
    padding:6px 8px;text-align:left;vertical-align:top;
    white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;
  }
  table.xls td.wrap{
    white-space:normal;word-break:break-word;
    min-width:180px;max-width:260px;
  }
  table.xls thead th{
    position:sticky;top:0;background:#e2e8f0;color:#0f172a;
    font-weight:700;z-index:2;text-transform:uppercase;letter-spacing:.02em;
    font-size:.72rem;
  }
  table.xls tbody tr:nth-child(even){background:#f8fafc;}
  table.xls tbody tr:active{background:#e0e7ff;}
  table.xls td .del-btn{
    background:none;border:none;color:var(--danger);font-size:1rem;
    padding:0;width:auto;cursor:pointer;
  }
  .empty-state{text-align:center;color:var(--muted);padding:40px 20px;font-size:.9rem;}

  .hint{font-size:.78rem;color:var(--muted);margin-top:4px;}

  /* Ajuste picker embebido */
  .picker-note{font-size:.72rem;color:var(--muted);text-align:center;margin-top:4px;}
</style>
</head>
<body>

<h1>📋 Registro de Documentación</h1>

<div class="card">

  <!-- Tipo + Nro -->
  <div class="row">
    <div class="field">
      <label for="tipo">Tipo de documento *</label>
      <select id="tipo">
        <option value="">— Seleccionar —</option>
      </select>
    </div>
    <div class="field">
      <label for="nroDoc">Nro. de documento *</label>
      <input id="nroDoc" type="text" placeholder="Ej: 0001" autocomplete="off">
    </div>
  </div>

  <!-- CITE con OCR -->
  <div class="field">
    <div class="ocr-row">
      <label style="margin:0;">CITE extraído por OCR</label>
      <span class="tag empty" id="tagCite">vacío</span>
    </div>
    <input id="cite" type="text" placeholder="Ej: CITE-2024-001" autocomplete="off">
  </div>

  <!-- Detalle con OCR -->
  <div class="field">
    <div class="ocr-row">
      <label style="margin:0;">Detalle / contenido</label>
      <span class="tag empty" id="tagContenido">vacío</span>
    </div>
    <textarea id="detalle" rows="5" placeholder="El texto reconocido aparecerá aquí..."></textarea>
  </div>

  <!-- OCR dos zonas -->
  <div class="field">
    <label>Escanear con cámara</label>
    <div class="dest-picker">
      <button class="btn-primary" data-target="cite">
        🎯 CITE
        <small>recorta el nro. de CITE</small>
      </button>
      <button class="btn-primary" data-target="contenido">
        📝 CONTENIDO
        <small>recorta el párrafo de detalle</small>
      </button>
    </div>
    <div class="btn-group" style="margin-top:8px;">
      <button id="btnGallery" class="btn-ghost" style="flex:1;">🖼️ Galería</button>
    </div>
    <input id="fileInput" type="file" accept="image/*" style="display:none">
    <img id="preview" alt="Última captura">
    <div class="status" id="status" style="font-size:.85rem;color:var(--muted);margin-top:8px;text-align:center;min-height:18px;"></div>
  </div>

  <!-- Fecha con ruleta -->
  <div class="field">
    <label>Fecha *</label>
    <div class="picker" id="datePicker">
      <div class="picker-highlight"></div>
      <div class="picker-col" data-col="day"></div>
      <div class="picker-col" data-col="month"></div>
      <div class="picker-col" data-col="year"></div>
    </div>
    <div class="picker-note">Desliza hacia arriba o abajo para elegir</div>
  </div>

  <!-- Hora con ruleta -->
  <div class="field">
    <label>Hora *</label>
    <div class="picker" id="timePicker">
      <div class="picker-highlight"></div>
      <div class="picker-col" data-col="hour"></div>
      <div class="picker-col" data-col="min"></div>
    </div>
    <div class="picker-note">Desliza hacia arriba o abajo para elegir</div>
  </div>

  <!-- Entrada/salida + medidas -->
  <div class="row">
    <div class="field">
      <label for="entradaSalida">Entrada / Salida *</label>
      <select id="entradaSalida">
        <option value="">—</option>
        <option value="Entrada">Entrada</option>
        <option value="Salida">Salida</option>
      </select>
    </div>
    <div class="field">
      <label for="medidas">Medidas tomadas</label>
      <input id="medidas" type="text" placeholder="Ej: 3 folios, 2 anexos">
    </div>
  </div>

  <button id="btnGuardar" class="btn-success">💾 Guardar registro</button>
</div>

<div class="card">
  <div class="btn-group">
    <button id="btnVerRegistros" class="btn-outline">📚 Ver registros</button>
    <button id="btnExportar" class="btn-warn">📊 Exportar Excel</button>
  </div>
  <p class="hint" style="text-align:center;margin-top:10px;">
    Registros guardados: <strong id="countRegistros">0</strong>
  </p>
</div>

<!-- ============ CÁMARA ============ -->
<div id="cameraWrap">
  <video id="video" autoplay playsinline muted></video>
  <div id="frameGuide"></div>
  <div class="cam-top">
    <button class="icon-btn" id="btnCancelCam" aria-label="Cerrar">✕</button>
    <span class="cam-title" id="camTitle">Encuadra el CITE</span>
    <button class="icon-btn" id="btnSwitchCam" aria-label="Cambiar cámara">🔄</button>
  </div>
  <div class="cam-bottom">
    <div style="width:44px"></div>
    <button class="shutter" id="btnShutter" aria-label="Capturar"></button>
    <div style="width:44px"></div>
  </div>
</div>

<!-- ============ CROPPER ============ -->
<div id="cropperWrap">
  <div class="cropper-container-wrap">
    <img id="cropperImage" alt="Recorte">
  </div>
  <div class="crop-bar">
    <div class="target-label" id="cropTargetLabel">ZONA A RECORTAR</div>
    <div class="actions">
      <button class="btn-danger" id="btnCancelCrop">Cancelar</button>
      <button class="btn-primary" id="btnApplyCrop">✂️ Extraer texto</button>
    </div>
  </div>
</div>

<!-- ============ MODAL REGISTROS TIPO EXCEL ============ -->
<div id="listModal">
  <div class="list-header">
    <div class="title-row">
      <h2>📊 Registros</h2>
      <button class="btn-ghost btn-sm" id="btnCloseList">✕ Cerrar</button>
    </div>
    <div class="search-row">
      <input id="searchInput" type="search" placeholder="🔍 Buscar por Nro., CITE, detalle, fecha…">
    </div>
    <div class="count" id="countFiltered">0 registros</div>
  </div>
  <div class="xls-wrap">
    <table class="xls" id="xlsTable">
      <thead>
        <tr>
          <th style="width:44px;">#</th>
          <th>Tipo</th>
          <th>Nro.</th>
          <th>CITE</th>
          <th>Detalle</th>
          <th>E/S</th>
          <th>Hora</th>
          <th>Fecha</th>
          <th>Medidas</th>
          <th style="width:52px;">Acción</th>
        </tr>
      </thead>
      <tbody id="xlsBody"></tbody>
    </table>
    <div class="empty-state" id="emptyList" style="display:none;">
      📭 No hay registros que coincidan.
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* ============================================================
   Estado
   ============================================================ */
const STORAGE_KEY = 'registros_docs_v3';
const TYPES_KEY   = 'tipos_documento_v3';

const state = {
  stream: null,
  cropper: null,
  facingMode: 'environment',
  ocrWorker: null,
  ocrReady: false,
  ocrLoading: false,
  currentTarget: null,
  registros: JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'),
  tipos: JSON.parse(localStorage.getItem(TYPES_KEY) || 'null'),
  // valores actuales de los pickers
  fecha: null,   // { day, month, year }
  hora: null     // { hour, min }
};
const $ = (id) => document.getElementById(id);

/* ============================================================
   Helpers
   ============================================================ */
function toast(msg, ms = 2800) {
  const t = $('toast'); t.textContent = msg;
  t.classList.add('show'); clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), ms);
}
function setStatus(msg, loading = false) {
  $('status').innerHTML = loading ? `<span class="spinner"></span> ${msg}` : msg;
}
function updateBadge(target, val) {
  const tag = target === 'cite' ? $('tagCite') : $('tagContenido');
  if (!tag) return;
  if (val && val.trim()) { tag.textContent = 'listo'; tag.className = 'tag ok'; }
  else { tag.textContent = 'vacío'; tag.className = 'tag empty'; }
}
function updateCount() {
  $('countRegistros').textContent = state.registros.length;
}
const pad = n => String(n).padStart(2, '0');
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

/* ============================================================
   TIPOS DE DOCUMENTO (select con opción "agregar")
   ============================================================ */
const TIPOS_DEFAULT = ['Oficio','Memorándum','Carta','Informe','Solicitud','Resolución','Circular','Nota','Otro'];
function loadTipos() {
  const sel = $('tipo');
  const tipos = state.tipos || TIPOS_DEFAULT;
  sel.innerHTML = '<option value="">— Seleccionar —</option>';
  tipos.forEach(t => {
    const o = document.createElement('option'); o.value = t; o.textContent = t;
    sel.appendChild(o);
  });
  const optAdd = document.createElement('option');
  optAdd.value = '__ADD__'; optAdd.textContent = '➕ Agregar tipo…';
  sel.appendChild(optAdd);
}
$('tipo').addEventListener('change', (e) => {
  if (e.target.value !== '__ADD__') return;
  const nuevo = prompt('Nombre del nuevo tipo de documento:');
  if (!nuevo || !nuevo.trim()) { e.target.value = ''; return; }
  const tipos = (state.tipos || TIPOS_DEFAULT).slice();
  const limpio = nuevo.trim();
  if (!tipos.includes(limpio)) tipos.push(limpio);
  state.tipos = tipos;
  localStorage.setItem(TYPES_KEY, JSON.stringify(tipos));
  loadTipos();
  $('tipo').value = limpio;
  toast('Tipo agregado');
});

/* ============================================================
   PICKER RULETA (fecha/hora)
   ============================================================ */
function buildPicker(containerEl, colKey, items, renderItem, selectedIdx, onChange) {
  const col = containerEl.querySelector(`[data-col="${colKey}"]`);
  col.innerHTML = '';
  // Relleno superior/inferior para centrar el primer/último valor
  const padTop = document.createElement('div'); padTop.style.height = '50px';
  const padBottom = document.createElement('div'); padBottom.style.height = '50px';
  col.appendChild(padTop);

  items.forEach((val, idx) => {
    const div = document.createElement('div');
    div.className = 'item';
    div.dataset.idx = idx;
    div.textContent = renderItem(val);
    div.addEventListener('click', () => {
      col.scrollTo({ top: idx * 50, behavior: 'smooth' });
    });
    col.appendChild(div);
  });
  col.appendChild(padBottom);

  // Posición inicial
  col.scrollTop = selectedIdx * 50;

  // Detecta el índice activo según scroll
  let scrollTimer = null;
  function onScroll() {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      const idx = Math.round(col.scrollTop / 50);
      const clamped = Math.max(0, Math.min(items.length - 1, idx));
      // Si no está exacto, corregir
      if (Math.abs(col.scrollTop - clamped * 50) > 1) {
        col.scrollTo({ top: clamped * 50, behavior: 'smooth' });
      }
      // Actualizar selección visual
      col.querySelectorAll('.item').forEach((el, i) => {
        el.classList.toggle('sel', i === clamped);
        el.classList.toggle('dim', i !== clamped);
      });
      onChange(clamped, items[clamped]);
    }, 90);
  }
  col.addEventListener('scroll', onScroll, { passive: true });
  // Disparo inicial para marcar el seleccionado
  setTimeout(() => onScroll(), 50);

  return {
    get index() { return Math.round(col.scrollTop / 50); },
    set index(i) { col.scrollTo({ top: i * 50, behavior: 'smooth' }); }
  };
}

function initDatePicker() {
  const now = new Date();
  const days    = Array.from({ length: 31 }, (_, i) => i + 1);
  const months  = MESES.map((m, i) => ({ idx: i, label: m }));
  const years   = Array.from({ length: 15 }, (_, i) => now.getFullYear() - 5 + i);

  state.fecha = { day: now.getDate(), month: now.getMonth(), year: now.getFullYear() };
  const cDay   = buildPicker($('datePicker'), 'day',   days,   v => v, state.fecha.day - 1, (i) => state.fecha.day = days[i]);
  const cMonth = buildPicker($('datePicker'), 'month', months, v => v.label, state.fecha.month, (i) => state.fecha.month = months[i].idx);
  const cYear  = buildPicker($('datePicker'), 'year',  years,  v => v, years.indexOf(now.getFullYear()), (i) => state.fecha.year = years[i]);

  state.fecha._pickers = { cDay, cMonth, cYear, years };
}

function initTimePicker() {
  const now = new Date();
  const hours   = Array.from({ length: 24 }, (_, i) => i);
  const minutes = Array.from({ length: 60 }, (_, i) => i);

  state.hora = { hour: now.getHours(), min: now.getMinutes() };
  const cHour = buildPicker($('timePicker'), 'hour', hours,   v => pad(v), now.getHours(), (i) => state.hora.hour = hours[i]);
  const cMin  = buildPicker($('timePicker'), 'min',  minutes, v => pad(v), now.getMinutes(), (i) => state.hora.min = minutes[i]);

  state.hora._pickers = { cHour, cMin };
}

function getFechaISO() {
  const f = state.fecha;
  return `${f.year}-${pad(f.month + 1)}-${pad(f.day)}`;
}
function getHoraHHMM() {
  return `${pad(state.hora.hour)}:${pad(state.hora.min)}`;
}

/* ============================================================
   Precarga OCR
   ============================================================ */
async function preloadOCR() {
  if (state.ocrReady || state.ocrLoading) return;
  state.ocrLoading = true;
  try {
    state.ocrWorker = await Tesseract.createWorker('spa', 1, { logger: () => {} });
    await state.ocrWorker.setParameters({
      tessedit_pageseg_mode: '6',
      preserve_interword_spaces: '1'
    });
    state.ocrReady = true;
  } catch (e) { console.warn('[OCR]', e); }
  finally { state.ocrLoading = false; }
}

/* ============================================================
   CÁMARA
   ============================================================ */
async function openCamera(target) {
  state.currentTarget = target;
  $('camTitle').textContent = target === 'cite'
    ? 'Encuadra el número de CITE'
    : 'Encuadra el contenido / detalle';
  try {
    state.stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: state.facingMode },
        width: { ideal: 1280 }, height: { ideal: 720 },
        frameRate: { ideal: 30, max: 30 }
      }, audio: false
    });
    const v = $('video'); v.srcObject = state.stream; await v.play();
    $('cameraWrap').classList.add('active', 'guide');
    preloadOCR();
  } catch (err) {
    console.error(err);
    toast('No se pudo abrir la cámara: ' + err.name, 4000);
  }
}
function closeCamera() {
  if (state.stream) { state.stream.getTracks().forEach(t => t.stop()); state.stream = null; }
  $('video').srcObject = null;
  $('cameraWrap').classList.remove('active');
}
async function switchCamera() {
  state.facingMode = state.facingMode === 'environment' ? 'user' : 'environment';
  closeCamera();
  await openCamera(state.currentTarget);
}
function capturePhoto() {
  const v = $('video');
  if (!v.videoWidth) { toast('La cámara aún no está lista'); return; }
  const c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  const dataUrl = c.toDataURL('image/jpeg', 0.92);
  closeCamera();
  openCropper(dataUrl);
}

/* ============================================================
   CROPPER
   ============================================================ */
function openCropper(dataUrl) {
  $('cropTargetLabel').textContent = state.currentTarget === 'cite'
    ? '✂️ Recortando para → CITE'
    : '✂️ Recortando para → CONTENIDO';
  const img = $('cropperImage');
  img.src = dataUrl;
  $('cropperWrap').classList.add('active');
  img.onload = () => {
    if (state.cropper) state.cropper.destroy();
    state.cropper = new Cropper(img, {
      viewMode: 1, autoCropArea: 0.7, movable: true, zoomable: true,
      scalable: false, responsive: true, background: false, guides: true,
      cropBoxMovable: true, cropBoxResizable: true
    });
  };
}
function closeCropper() {
  $('cropperWrap').classList.remove('active');
  if (state.cropper) { state.cropper.destroy(); state.cropper = null; }
}
async function applyCropAndOCR() {
  if (!state.cropper) return;
  const canvas = state.cropper.getCroppedCanvas({
    maxWidth: 1400, maxHeight: 1400, fillColor: '#fff'
  });
  const processed = preprocessForOCR(canvas);
  const dataUrl = processed.toDataURL('image/jpeg', 0.92);
  $('preview').src = dataUrl;
  $('preview').style.display = 'block';
  const target = state.currentTarget;
  closeCropper();
  await runOCR(dataUrl, target);
}
function preprocessForOCR(sourceCanvas) {
  const c = document.createElement('canvas');
  c.width = sourceCanvas.width; c.height = sourceCanvas.height;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(sourceCanvas, 0, 0);
  const img = ctx.getImageData(0, 0, c.width, c.height);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const g = d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114;
    const v = g < 110 ? 0 : g > 160 ? 255 : g;
    d[i] = d[i+1] = d[i+2] = v;
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

/* ============================================================
   OCR
   ============================================================ */
async function runOCR(imageDataUrl, target) {
  if (!state.ocrReady) {
    setStatus('Cargando motor OCR (primera vez)...', true);
    await preloadOCR();
    if (!state.ocrReady) { setStatus('❌ No se pudo cargar OCR'); return; }
  }
  setStatus('Reconociendo texto...', true);
  try {
    const { data: { text } } = await state.ocrWorker.recognize(imageDataUrl);
    const limpio = text.trim().replace(/\n{3,}/g, '\n\n');
    if (!limpio) { setStatus('⚠️ No se detectó texto'); toast('No se detectó texto en la región'); return; }

    if (target === 'cite') {
      const primera = limpio.split(/\n/)[0].trim();
      $('cite').value = primera;
      updateBadge('cite', primera);
    } else {
      const ta = $('detalle');
      ta.value = ta.value ? ta.value + '\n' + limpio : limpio;
      updateBadge('contenido', ta.value);
    }
    setStatus(`✅ Texto extraído (${limpio.length} caracteres)`);
    toast('Texto reconocido');
  } catch (err) {
    console.error(err);
    setStatus('❌ Error al reconocer texto');
    toast('Error OCR: ' + err.message, 4000);
  }
}

/* ============================================================
   Galería
   ============================================================ */
$('btnGallery').addEventListener('click', () => {
  const t = prompt('¿Para qué campo es esta imagen? Escribe "cite" o "contenido":', 'contenido');
  if (!t) return;
  state.currentTarget = t.trim().toLowerCase().startsWith('c') ? 'cite' : 'contenido';
  $('fileInput').click();
});
$('fileInput').addEventListener('change', (e) => {
  const f = e.target.files?.[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = (ev) => openCropper(ev.target.result);
  reader.readAsDataURL(f);
  e.target.value = '';
});

/* ============================================================
   Guardar
   ============================================================ */
function guardar() {
  const tipo          = $('tipo').value.trim();
  const nroDoc        = $('nroDoc').value.trim();
  const cite          = $('cite').value.trim();
  const detalle       = $('detalle').value.trim();
  const entradaSalida = $('entradaSalida').value;
  const medidas       = $('medidas').value.trim();

  const hora  = getHoraHHMM();
  const fecha = getFechaISO();

  if (!tipo || !nroDoc || !entradaSalida) {
    toast('Complete Tipo, Nro. y Entrada/Salida'); return;
  }
  if (!cite && !detalle) {
    toast('Debe registrar al menos CITE o Detalle'); return;
  }

  const reg = {
    id: Date.now(),
    tipo, nroDoc, cite, detalle, entradaSalida, hora, fecha, medidas,
    creadoEn: new Date().toISOString()
  };
  state.registros.push(reg);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.registros));
  updateCount();
  toast('✅ Registro guardado');

  // Limpieza (fecha/hora se conservan por comodidad)
  ['nroDoc','cite','detalle','medidas'].forEach(id => $(id).value = '');
  $('tipo').value = '';
  $('entradaSalida').value = '';
  $('preview').style.display = 'none';
  updateBadge('cite', ''); updateBadge('contenido', '');
  setStatus('');
}

/* ============================================================
   Modal REGISTROS estilo Excel
   ============================================================ */
function openList() {
  renderTabla('');
  $('listModal').classList.add('active');
  setTimeout(() => $('searchInput').focus(), 100);
}
function closeList() { $('listModal').classList.remove('active'); }

function normalizar(s) {
  return String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function renderTabla(filtro) {
  const q = normalizar(filtro.trim());
  const todos = [...state.registros].reverse();
  const filtrados = !q ? todos : todos.filter(r => {
    const bolsa = [
      r.tipo, r.nroDoc, r.cite, r.detalle, r.entradaSalida,
      r.hora, r.fecha, r.medidas
    ].map(normalizar).join(' | ');
    return bolsa.includes(q);
  });

  const tbody = $('xlsBody');
  const empty = $('emptyList');
  $('countFiltered').textContent = `${filtrados.length} registro${filtrados.length === 1 ? '' : 's'}` +
    (q ? ` (de ${todos.length})` : '');

  if (!filtrados.length) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  tbody.innerHTML = filtrados.map((r, i) => `
    <tr>
      <td>${i + 1}</td>
      <td>${escapeHtml(r.tipo)}</td>
      <td>${escapeHtml(r.nroDoc)}</td>
      <td>${escapeHtml(r.cite)}</td>
      <td class="wrap">${escapeHtml(r.detalle)}</td>
      <td>${r.entradaSalida === 'Entrada' ? '⬇️' : '⬆️'} ${escapeHtml(r.entradaSalida)}</td>
      <td>${escapeHtml(r.hora)}</td>
      <td>${escapeHtml(r.fecha)}</td>
      <td>${escapeHtml(r.medidas)}</td>
      <td><button class="del-btn" data-id="${r.id}" title="Eliminar">🗑️</button></td>
    </tr>
  `).join('');

  tbody.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const id = Number(e.target.dataset.id);
      if (!confirm('¿Eliminar este registro?')) return;
      state.registros = state.registros.filter(x => x.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.registros));
      updateCount();
      renderTabla($('searchInput').value);
    });
  });
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

$('searchInput').addEventListener('input', (e) => renderTabla(e.target.value));

/* ============================================================
   Exportar Excel
   ============================================================ */
function exportarExcel() {
  if (!state.registros.length) { toast('No hay registros para exportar'); return; }
  const datos = state.registros.map(r => ({
    'Tipo de documento': r.tipo,
    'Nro. de documento': r.nroDoc,
    'CITE': r.cite,
    'Detalle': r.detalle,
    'Entrada/Salida': r.entradaSalida,
    'Hora': r.hora,
    'Fecha': r.fecha,
    'Medidas tomadas': r.medidas
  }));
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(datos);
  ws['!cols'] = [
    { wch: 18 }, { wch: 16 }, { wch: 20 }, { wch: 40 },
    { wch: 14 }, { wch: 8 },  { wch: 12 }, { wch: 24 }
  ];
  XLSX.utils.book_append_sheet(wb, ws, 'Registros');
  const nombre = `registros_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, nombre);
  toast('📊 Excel generado');
}

/* ============================================================
   Eventos
   ============================================================ */
document.querySelectorAll('.dest-picker button').forEach(btn => {
  btn.addEventListener('click', () => openCamera(btn.dataset.target));
});
$('btnCancelCam').addEventListener('click', closeCamera);
$('btnShutter').addEventListener('click', capturePhoto);
$('btnSwitchCam').addEventListener('click', switchCamera);
$('btnCancelCrop').addEventListener('click', closeCropper);
$('btnApplyCrop').addEventListener('click', applyCropAndOCR);
$('btnGuardar').addEventListener('click', guardar);
$('btnVerRegistros').addEventListener('click', openList);
$('btnCloseList').addEventListener('click', closeList);
$('btnExportar').addEventListener('click', exportarExcel);

$('cite').addEventListener('input', e => updateBadge('cite', e.target.value));
$('detalle').addEventListener('input', e => updateBadge('contenido', e.target.value));

window.addEventListener('beforeunload', () => {
  if (state.stream) state.stream.getTracks().forEach(t => t.stop());
});

/* ============================================================
   Init
   ============================================================ */
(function init() {
  loadTipos();
  updateCount();
  updateBadge('cite', '');
  updateBadge('contenido', '');
  initDatePicker();
  initTimePicker();

  if ('requestIdleCallback' in window) requestIdleCallback(preloadOCR, { timeout: 3000 });
  else setTimeout(preloadOCR, 1500);
})();
</script>
</body>
</html>
